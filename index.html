<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>IG Carousel Preview (private)</title><style>
body{margin:0;background:#fafafa;font-family:-apple-system,system-ui,sans-serif;color:#111}
header{text-align:center;padding:20px 12px 4px}h1{font-size:18px;margin:0}
.post{max-width:470px;margin:24px auto;background:#fff;border:1px solid #dbdbdb;border-radius:8px;overflow:hidden}
h2{font-size:15px;margin:0;padding:12px 14px}.hold{background:#ed4956;color:#fff;font-size:11px;padding:3px 7px;border-radius:4px;margin-left:6px;text-transform:uppercase}
.frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#000}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start}.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:22px;line-height:26px;cursor:pointer}
.prev{left:8px}.next{right:8px}.dots{text-align:center;padding:10px}.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c7c7c7;margin:0 2px}.dots i.on{background:#0095f6}
</style></head><body><header><h1>Instagram carousel preview</h1><p style="font-size:13px;color:#666">Private. Swipe or use the arrows.</p></header>

<button class="nav prev" aria-label="Previous">&#8249;</button><button class="nav next" aria-label="Next">&#8250;</button></div>

<script>
document.querySelectorAll('.post').forEach(p=>{const t=p.querySelector('.track'),d=p.querySelectorAll('.dots i'),v=p.querySelector('video');
const idx=()=>Math.round(t.scrollLeft/t.clientWidth);
const upd=()=>{const i=idx();d.forEach((e,k)=>e.classList.toggle('on',k==i));vis(p)};
t.addEventListener('scroll',()=>{clearTimeout(t._t);t._t=setTimeout(upd,80)});
p.querySelector('.prev').onclick=()=>t.scrollTo({left:(idx()-1)*t.clientWidth,behavior:'smooth'});
p.querySelector('.next').onclick=()=>t.scrollTo({left:(idx()+1)*t.clientWidth,behavior:'smooth'});p._v=v;p._i=idx});
function vis(p){if(p._seen&&p._i()==1){p._v.muted=true;p._v.play().catch(()=>{})}else p._v.pause()}
const io=new IntersectionObserver(es=>es.forEach(e=>{e.target._seen=e.isIntersecting;vis(e.target)}),{threshold:.5});document.querySelectorAll('.post').forEach(p=>io.observe(p));
</script></body></html>
